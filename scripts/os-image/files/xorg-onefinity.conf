Section "ServerFlags"
    Option "DontVTSwitch" "on"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

# The firmware's framebuffer, as on the 2017 card (config.txt has no KMS
# overlay, and display_rotate=2 turns the picture there)
Section "Device"
    Identifier "fb"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
